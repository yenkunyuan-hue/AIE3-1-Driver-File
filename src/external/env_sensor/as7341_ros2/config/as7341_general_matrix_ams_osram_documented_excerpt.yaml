# AS7341 general light detection correction matrix excerpt.
#
# Source: ams OSRAM AS7341 Eval Kit Manual UG000400, Figure 17.
# The manual identifies CM_L1_v1_0_0.csv as the general calibration matrix for
# light detection and shows only example rows in the public PDF. The complete
# CSV appears to be part of the AS7341 Evaluation Kit software package, not fully
# printed in the public manual.
#
# This YAML contains only the rows explicitly printed in the public manual:
# 380 nm, 381 nm, 382 nm, 999 nm, and 1000 nm.
# It is included so the ROS 2 calibration path uses the same YAML format and the
# documented coefficients can be tested. It is not a complete spectral
# reconstruction matrix.
unit: reconstructed_relative_spectrum_excerpt
source_name: CM_L1_v1_0_0 documented excerpt
input_channels: [F1_415, F2_445, F3_480, F4_515, F5_555, F6_590, F7_630, F8_680, CLEAR, NIR]
rows:
  - channel_name: S380
    wavelength_nm: 380.0
    fwhm_nm: 1.0
    bias: 0.0
    coefficients:
      F1_415: 0.19414
      F2_445: -0.03387
      F3_480: 0.009500
      F4_515: -0.00185
      F5_555: 0.001581
      F6_590: -0.00036
      F7_630: 0.000774
      F8_680: -0.00028
      CLEAR: -0.00695
